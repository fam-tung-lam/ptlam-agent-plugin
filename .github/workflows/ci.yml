name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request' && format('pr-{0}',
    github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI Required
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: >-
        ${{ github.event_name == 'pull_request' &&
        github.event.pull_request.base.sha || github.event_name == 'push' &&
        github.event.before || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js and dependencies
        uses: ./.github/actions/set-up-node
      - name: Validate release metadata
        run: npm run release:check
      - name: Validate plugin input and generated artifacts
        run: npm run plugin:verify
      - name: Type-check project code
        run: npm run code:typecheck
      - name: Check project code quality
        run: npm run code:check
      - name: Check Markdown quality
        run: npm run markdown:check
      - name: Run tests with coverage
        run: npm run test:coverage
