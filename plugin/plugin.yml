# Version of the plugin.yml structure understood by the compiler.
# Change only when the manifest schema becomes incompatible.
schema_version: 2

providers:
  - claude
  - codex
  - copilot
  - gemini
  - kimi

name: ptlam-agent-plugin
description:
  A curated collection of portable agent skills for engineering, productivity,
  and utility workflows.

# Plugin version. Build metadata after "+" does not affect SemVer
# precedence.
version: "0.1.0-alpha.1"

author:
  name: Pham Tung Lam
  email: fam.tung.lam@gmail.com
  url: https://github.com/fam-tung-lam
homepage: https://github.com/fam-tung-lam/ptlam-agent-plugin#readme
repository: https://github.com/fam-tung-lam/ptlam-agent-plugin
license: MIT
keywords:
  - agent-skills
  - engineering
  - productivity
  - utilities

categories:
  - id: engineering
    name: Engineering
    description: Skills for reviewing and delivering software changes.
  - id: productivity
    name: Productivity
    description: Skills for planning work and communicating ideas clearly.
  - id: utilities
    name: Utilities
    description: Focused helpers for small, repeatable transformations.

skills:
  - id: ptlam-setup
    description:
      Install or refresh PTLam's general agent instructions for a project.
    disable_model_invocation: true
    category_id: utilities
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-git
    description:
      Apply PTLam's commit-message preferences and maintain project-local Git
      context. Use for repository-tied Git work that should load current facts
      or preferences from CONTEXT.md; for recording, refreshing, or
      consolidating durable Git context; and for creating or changing a commit
      message. Apply current user, repository, and CONTEXT.md preferences before
      the portable defaults.
    category_id: engineering
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-testing
    description:
      Design, write, update, run, review, and diagnose automated tests at unit,
      integration, and end-to-end levels. Use when an agent needs to select a
      test level, add or repair tests, improve testability, assess test quality,
      audit test code for compliance, maintain or refresh project-local testing
      context, resolve a project's testing environment, select or recommend
      compatible test tools, or follow an explicitly requested test-first or
      Red-Green-Refactor workflow. Do not infer TDD merely from a request for
      tests or integration testing.
    category_id: engineering
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-testing-typescript
    description:
      Design, write, update, run, audit, and diagnose tests for framework-free,
      browser-free TypeScript libraries, Node.js code, CLIs, and tooling with
      Vite, Vitest, and Vitest V8 coverage. Use when such a project needs test
      implementation, Vitest configuration, coverage, mocking, Node
      environments, type tests, or stack-specific testing review. Apply
      ptlam-testing first for testing scope, level, behavior, placement, test
      doubles, TDD, and audit authority. Do not use this specialization for web
      frameworks, DOM code, or browser-runtime testing.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-testing
        reason: Provides the universal testing workflow and mandatory rules.
        instructions: |-
          Read and apply ptlam-testing first.
          Let it own scope, level, public seam, behavior, doubles, TDD, audit
          authority, and verification depth.
          Use the repository's established test layout when one exists;
          otherwise use this skill's source-adjacent fallback.
          Apply it only to framework-free, browser-free TypeScript, Vite, Vitest,
          and coverage mechanics left open by the foundation.
  - id: ptlam-creating-skill
    description:
      Create, review, or refactor atomic, self-contained agent skills with one
      reusable capability, explicit composition contracts, predictable
      workflows, progressive disclosure, and verifiable acceptance. Use as the
      foundation for skills that specialize skill authoring.
    disable_model_invocation: true
    category_id: engineering
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-grilling
    description:
      Stress-test a plan, decision, or idea through a persistent interview that
      resolves one user-owned decision at a time and records confirmed
      understanding for later continuation.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-creating-atomic-note
    description:
      Create, mature, review, split, or merge durable atomic notes by
      identifying one knowledge building block, preserving useful context, and
      following local vault conventions.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-scrapping-urls
    description:
      Batch-scrape URLs supplied in a prompt or input file into cached local
      Markdown files with configurable output, concurrency, and cache lifetime.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-explaining
    description:
      Explain concepts, mechanisms, and systems through a verified literal model
      and an explanatory device matched to the learner's difficulty.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-explaining-with-analogy
    description:
      Explain an unfamiliar, abstract, or complex concept through one coherent
      real-life analogy, a stable mapping table, a short story, and explicit
      caveats.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-explaining
        reason:
          Provides the learning goal, literal model, and verification the
          analogy is built on.
        instructions: |-
          Read and apply ptlam-explaining first.
          Let it own the learning goal, depth, the literal model, composition
          order, and verification.
          Enter this skill only when the learner explicitly asked for an
          analogy, and apply it only to analogy selection, the mapping gate, the
          story, and the stated limits.
  - id: ptlam-visualization-with-html
    description:
      Create or revise portable, polished, interactive HTML explainers and
      learning artifacts for architecture, workflows, state changes, sequences,
      entity relationships, semantic zoom, and step-by-step behavior using
      native web technologies and Material 3 Expressive.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-explaining-with-analogy
        reason:
          Owns analogy selection and explanation semantics before HTML
          rendering.
        instructions: |-
          Apply ptlam-explaining-with-analogy only when the user explicitly asks
          to create an analogy and has not already supplied or chosen one.
          Let it own the literal model, candidates, user choice, stable mapping,
          story, and caveats. Resume this visualization skill after the choice
          and let it own only the portable HTML rendering and visual interaction.
