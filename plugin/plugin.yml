# Version of the plugin.yml structure understood by the compiler.
# Change only when the manifest schema becomes incompatible.
schema_version: 2

providers:
  - claude
  - codex
  - copilot
  - gemini
  - kimi

name: ptlam-agent-plugin
description:
  A curated collection of portable agent skills for engineering, productivity,
  and utility workflows.

# Plugin version. Build metadata after "+" does not affect SemVer
# precedence.
version: "0.1.0-alpha.1"

author:
  name: Pham Tung Lam
  email: fam.tung.lam@gmail.com
  url: https://github.com/fam-tung-lam
homepage: https://github.com/fam-tung-lam/ptlam-agent-plugin#readme
repository: https://github.com/fam-tung-lam/ptlam-agent-plugin
license: MIT
keywords:
  - agent-skills
  - engineering
  - productivity
  - utilities

categories:
  - id: engineering
    name: Engineering
    description: Skills for reviewing and delivering software changes.
  - id: productivity
    name: Productivity
    description: Skills for planning work and communicating ideas clearly.
  - id: utilities
    name: Utilities
    description: Focused helpers for small, repeatable transformations.

skills:
  - id: ptlam-setup
    description:
      Install or refresh PTLam's general agent instructions for a project.
    disable_model_invocation: true
    category_id: utilities
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-git-writing-commit-message
    description:
      Create or revise one commit message from the current change, current user
      instructions, and applicable AGENTS.md rules. Use when a repository-tied
      Git workflow needs a commit subject, body, or issue reference.
    category_id: engineering
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-testing
    description:
      Design, write, update, run, review, and diagnose automated tests at unit,
      integration, and end-to-end levels. Use when an agent needs to select a
      test level, add or repair tests, improve testability, assess test quality,
      audit test code for compliance, diagnose failures, or follow an explicitly
      requested test-first or Red-Green-Refactor workflow. Do not infer TDD
      merely from a request for tests or integration testing.
    category_id: engineering
    visibility: internal
    status: active
    required_skills: []
  - id: ptlam-testing-typescript
    description:
      Design, write, update, run, audit, and diagnose tests for framework-free,
      browser-free TypeScript libraries, Node.js code, CLIs, and tooling with
      Vite, Vitest, and Vitest V8 coverage. Use when such a project needs test
      implementation, Vitest configuration, coverage, mocking, Node
      environments, type tests, or stack-specific testing review. Apply
      ptlam-testing first for mode, write authority, testing scope, level,
      behavior, placement, test doubles, TDD, audit, and diagnosis. Do not use
      this specialization for web frameworks, DOM code, or browser-runtime
      testing.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-testing
        reason: Provides the universal testing workflow and mandatory rules.
        instructions: |-
          Read and apply ptlam-testing first.
          Let it own mode, write authority, scope, level, public seam, behavior,
          doubles, TDD, audit, diagnosis, and verification depth.
          Use the repository's established test layout when one exists;
          otherwise use this skill's source-adjacent fallback.
          Use this skill's bundled Vite and Vitest contract for stack mechanics.
          Apply it only to framework-free, browser-free TypeScript, Vite, Vitest,
          and coverage mechanics left open by the foundation.
  - id: ptlam-creating-skill
    description:
      Create, review, or refactor one agent skill so that a human maintainer can
      read it once and change it later. Use when turning a workflow or reference
      set into a new skill, revising an existing SKILL.md, splitting a skill that
      grew too broad, or auditing a package without editing it. Use as the
      foundation for skills that specialize skill authoring.
    disable_model_invocation: true
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-mermaiding
        reason:
          Owns every Mermaid diagram a skill package carries, from type
          selection to syntax verification.
        instructions: |-
          Read and apply ptlam-mermaiding whenever a skill file needs a diagram,
          and skip it when no visual is warranted.
          Let it own the visual question, diagram type, notation, layout, and
          syntax verification for that diagram.
          Keep this skill's ownership of what the package says, which form
          carries each point, and which file holds it.
  - id: ptlam-grilling
    description:
      Stress-test a plan, decision, or idea through a persistent interview that
      resolves one user-owned decision at a time and records confirmed
      understanding for later continuation.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-creating-atomic-note
    description:
      Create, mature, review, split, or merge durable atomic notes by
      identifying one knowledge building block, preserving useful context, and
      following local vault conventions.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-scrapping-urls
    description:
      Batch-scrape URLs supplied in a prompt or input file into cached local
      Markdown files with configurable output, concurrency, and cache lifetime.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-explaining
    description:
      Explain concepts, mechanisms, and systems through a verified literal model
      and an explanatory device matched to the learner's difficulty. Use when a
      learner needs an unfamiliar, abstract, or complex concept made usable, and
      when a request explicitly asks for a real-life analogy with a stable
      mapping table, a short story, and explicit caveats. Select the analogy
      device only on that explicit ask; a request to explain, define, simplify,
      or break down a concept is not that ask.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-mermaiding
    description:
      Create, revise, or review Mermaid diagrams whose type, structure,
      notation, and layout preserve the source relationships and remain readable
      in raw Markdown. Use directly or from another skill when the output needs
      a swimlane, flowchart, class, state, ER, sequence, quadrant, mindmap,
      kanban, architecture, or tree-view diagram.
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-visualization-with-html
    description:
      Create or revise portable, polished, interactive HTML explainers and
      learning artifacts for architecture, workflows, state changes, sequences,
      entity relationships, semantic zoom, and step-by-step behavior using
      native web technologies and Material 3 Expressive.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-explaining
        reason:
          Supplies the verified explanation the artifact renders, including its
          optional analogy branch.
        instructions: |-
          Read and apply ptlam-explaining for every artifact. Let it own the
          learning goal, depth, literal answer, literal model, explanatory
          structure, and reconstruction verification.
          Enter its analogy branch only when the user explicitly asks for an
          analogy or supplies one. Let that branch own candidates, user choice,
          the stable mapping, the story, and the caveats. Consume those outputs
          without building a parallel analogy.
          Keep this visualization skill's ownership of the portable HTML
          rendering and the visual interaction.
