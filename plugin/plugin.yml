# Version of the plugin.yml structure understood by the compiler.
# Change only when the manifest schema becomes incompatible.
schema_version: 2

providers:
  - claude
  - codex
  - copilot
  - gemini
  - kimi

name: ptlam-agent-plugin
description:
  A curated collection of portable agent skills for engineering, productivity,
  and utility workflows.

# Plugin version. Build metadata after "+" does not affect SemVer
# precedence.
version: "0.1.0-alpha.1"

author:
  name: Pham Tung Lam
  email: fam.tung.lam@gmail.com
  url: https://github.com/fam-tung-lam
homepage: https://github.com/fam-tung-lam/ptlam-agent-plugin#readme
repository: https://github.com/fam-tung-lam/ptlam-agent-plugin
license: MIT
keywords:
  - agent-skills
  - engineering
  - productivity
  - utilities

categories:
  - id: engineering
    name: Engineering
    description: Skills for reviewing and delivering software changes.
  - id: productivity
    name: Productivity
    description: Skills for planning work and communicating ideas clearly.
  - id: utilities
    name: Utilities
    description: Focused helpers for small, repeatable transformations.

skills:
  - id: ptlam-setup
    description:
      Install or refresh PTLam's general agent instructions for a project.
    disable_model_invocation: true
    category_id: utilities
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-git
    description:
      Carry out repository-local Git commit and worktree workflows without
      disturbing unrelated work. Use when creating a commit, writing or revising
      a commit message, creating or managing a worktree, or deciding whether a
      repository write belongs in the current checkout or a new linked worktree.
    category_id: engineering
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-code-style
    description:
      Hold source and test code to one language-neutral set of conventions for
      visibility, documentation, logging, and testing. Use when deciding what a
      test must prove, choosing a test level, placing a test or a test double,
      setting a public or internal boundary, writing a doc comment, or emitting
      a log record. Use as the foundation for a stack specialization that adds
      the mechanics.
    category_id: engineering
    visibility: internal
    status: active
    required_skills: []
  - id: ptlam-code-style-flutter
    description:
      Write, review, and fix Flutter application code against conventions for
      the toolchain, layer boundaries, source tree, widgets, models, networking,
      storage, localization, logging, doc comments, and tests. Use when adding
      or changing Dart code in a Flutter project, choosing between setState,
      Cubit, and Bloc, placing a new file or feature, wiring get_it or
      go_router, or fixing a flutter analyze, dart format, or build_runner
      failure. Apply ptlam-code-style first for the standard these mechanics
      satisfy. Do not use this specialization for Dart outside Flutter or for
      another stack.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style
        reason:
          Provides the language-neutral conventions and the testing doctrine the
          Flutter mechanics satisfy.
        instructions: |-
          Read and apply ptlam-code-style first.
          Let it own the precedence order, the visibility, documentation, and
          logging standards, the universal behavior contract, the test levels,
          test placement, and test doubles.
          Use this skill only for the Flutter and Dart mechanics that satisfy
          those standards.
          This specialization may be stricter than the foundation, never looser.
  - id: ptlam-code-style-python
    description:
      Write, review, and fix Python library and application code against
      conventions for language mechanics, project structure, tooling, and
      tests. Use when starting or standardizing a Python project, changing
      Python code or its toolchain, reviewing Python-specific design, or
      resolving code-quality and test failures. Apply ptlam-code-style first for
      the standard these mechanics satisfy. Use as the foundation for Python
      framework specializations. Do not use for non-Python code.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style
        reason:
          Provides the language-neutral conventions and testing doctrine the
          Python mechanics satisfy.
        instructions: |-
          Read and apply ptlam-code-style first.
          Let it own precedence, visibility, documentation and logging
          standards, the universal behavior contract, test levels, test
          placement, and test doubles.
          Use this skill only for Python language, library, and tool mechanics
          that satisfy those standards.
          This specialization may be stricter than the foundation, never looser.
  - id: ptlam-code-style-python-fastapi
    description:
      Write, review, and fix FastAPI application code against conventions for
      project and feature-module structure, application lifespan, routes,
      request and response contracts, dependency injection, concurrency,
      service boundaries, errors, observability, and API tests. Use when
      starting or reorganizing a FastAPI service or module, adding or changing
      endpoints, dependencies, exception handlers, middleware, schemas,
      background handoffs, or tests, or fixing OpenAPI and runtime failures.
      Apply ptlam-code-style-python first for the Python mechanics. Do not use
      for Python services that do not use FastAPI.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style-python
        reason:
          Provides the Python language, data-model, concurrency, exception, and
          pytest mechanics underneath the FastAPI boundary.
        instructions: |-
          Read and apply ptlam-code-style-python first; it loads
          ptlam-code-style as its own foundation.
          Let Python own the interpreter and toolchain, modules, imports,
          typing, general async work, Pydantic, exception mechanics, docstrings,
          logging, and pytest.
          Use this skill only for FastAPI application, HTTP, dependency,
          lifecycle, and ASGI test mechanics.
          This specialization may be stricter than Python, never looser.
  - id: ptlam-creating-skill
    description:
      Create, review, or refactor one agent skill so that a human maintainer can
      read it once and change it later. Use when turning a workflow or reference
      set into a new skill, revising an existing SKILL.md, splitting a skill
      that grew too broad, or auditing a package without editing it. Use as the
      foundation for skills that specialize skill authoring.
    disable_model_invocation: true
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-mermaiding
        reason:
          Owns every Mermaid diagram a skill package carries, from type
          selection to syntax verification.
        instructions: |-
          Read ptlam-mermaiding before judging an existing diagram or deciding
          whether a new diagram is warranted.
          Apply its authoring workflow only when the selected form is a diagram.
          Let it own the visual question, diagram type, notation, layout, and
          syntax verification for that diagram.
          Keep this skill's ownership of what the package says, which form
          carries each point, and which file holds it.
  - id: ptlam-grilling
    description:
      Stress-test a plan, decision, or idea through a persistent interview that
      resolves one user-owned decision at a time and records confirmed
      understanding for later continuation.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-creating-atomic-note
    description:
      Create, mature, review, split, or merge durable atomic notes by
      identifying one knowledge building block, preserving useful context, and
      following local vault conventions.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-scraping-urls
    description:
      Batch-scrape URLs supplied in a prompt or input file into cached local
      Markdown files with configurable output, concurrency, and cache lifetime.
    disable_model_invocation: true
    category_id: utilities
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-explaining
    description:
      Explain concepts, mechanisms, and systems through a verified literal model
      and an explanatory device matched to the learner's difficulty. Use when a
      learner needs an unfamiliar, abstract, or complex concept made usable, and
      when a request explicitly asks for a real-life analogy with a stable
      mapping table, a short story, and explicit caveats. Select the analogy
      device only on that explicit ask; a request to explain, define, simplify,
      or break down a concept is not that ask.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-mermaiding
    description:
      Create, revise, or review Mermaid diagrams whose type, structure,
      notation, and layout preserve the source relationships and remain readable
      in raw Markdown. Use directly or from another skill when the output needs
      a swimlane, flowchart, class, state, ER, sequence, quadrant, mindmap,
      kanban, architecture, or tree-view diagram.
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-visualization-with-html
    description:
      Create or revise one portable HTML explainer that renders a verified
      explanation as an accessible, optionally interactive artifact using native
      web technologies and Material 3 Expressive.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-explaining
        reason:
          Supplies the verified explanation the artifact renders, including its
          optional analogy branch.
        instructions: |-
          Read and apply ptlam-explaining for every artifact. Let it own the
          learning goal, depth, literal answer, literal model, explanatory
          structure, and reconstruction verification.
          Enter its analogy branch only when the user explicitly asks for an
          analogy or supplies one. Let that branch own candidates, user choice,
          the stable mapping, the story, and the caveats. Consume those outputs
          without building a parallel analogy.
          Keep this visualization skill's ownership of the portable HTML
          rendering and the visual interaction.
