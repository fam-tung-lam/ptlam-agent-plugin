# Version of the plugin.yml structure understood by the compiler.
# Change only when the manifest schema becomes incompatible.
schema_version: 2

providers:
  - claude
  - codex
  - copilot
  - gemini
  - kimi

name: ptlam-agent-plugin
description:
  A curated collection of portable agent skills for engineering, productivity,
  and utility workflows.

# Plugin version. Build metadata after "+" does not affect SemVer
# precedence.
version: "0.1.0-alpha.1"

author:
  name: Pham Tung Lam
  email: fam.tung.lam@gmail.com
  url: https://github.com/fam-tung-lam
homepage: https://github.com/fam-tung-lam/ptlam-agent-plugin#readme
repository: https://github.com/fam-tung-lam/ptlam-agent-plugin
license: MIT
keywords:
  - agent-skills
  - engineering
  - productivity
  - utilities

categories:
  - id: engineering
    name: Engineering
    description: Skills for reviewing and delivering software changes.
  - id: productivity
    name: Productivity
    description: Skills for planning work and communicating ideas clearly.
  - id: utilities
    name: Utilities
    description: Focused helpers for small, repeatable transformations.

skills:
  - id: ptlam-setup
    description:
      Install or refresh PTLam's general agent instructions for a project.
    disable_model_invocation: true
    category_id: utilities
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-git-managing-context
    description:
      Resolve, create, refresh, review, or consolidate one repository's durable
      Git facts and preferences in project-local CONTEXT.md. Use read-only when
      another Git workflow needs current project context, and write only when
      the user explicitly requests context maintenance.
    category_id: engineering
    visibility: internal
    status: active
    required_skills: []
  - id: ptlam-git-writing-commit-message
    description:
      Create or revise one commit message from the current change and verified
      project Git preferences. Use when a repository-tied Git workflow needs a
      commit subject, body, or issue reference.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-git-managing-context
        reason: Provides verified repository facts and Git preferences.
        instructions: |-
          Read and apply ptlam-git-managing-context first in read-only mode.
          Let it own repository resolution, context location, freshness, and
          stored Git preferences. Do not maintain context while writing the
          message; report suggested context changes separately.
          Apply this skill only to the commit message and its verification.
  - id: ptlam-testing-managing-context
    description:
      Resolve, create, refresh, review, or consolidate one project's durable
      testing facts and preferences in project-local CONTEXT.md. Use read-only
      when another testing workflow needs current project context, and write
      only when the user explicitly requests context maintenance.
    category_id: engineering
    visibility: internal
    status: active
    required_skills: []
  - id: ptlam-testing-resolving-environment
    description:
      Resolve, evaluate, recommend, or apply one project's testing environment
      and toolchain. Use when the current environment is ambiguous, unverified,
      incompatible, missing, being replaced, or explicitly under review.
    category_id: engineering
    visibility: internal
    status: active
    required_skills: []
  - id: ptlam-testing
    description:
      Design, write, update, run, review, and diagnose automated tests at unit,
      integration, and end-to-end levels. Use when an agent needs to select a
      test level, add or repair tests, improve testability, assess test quality,
      audit test code for compliance, diagnose failures, or follow an explicitly
      requested test-first or Red-Green-Refactor workflow. Do not infer TDD
      merely from a request for tests or integration testing.
    category_id: engineering
    visibility: internal
    status: active
    required_skills:
      - skill_id: ptlam-testing-managing-context
        reason: Provides verified project testing facts and preferences.
        instructions: |-
          Read and apply ptlam-testing-managing-context first in read-only mode
          for every project-tied task. Let it own the project root, context
          path, freshness, and stored testing facts. Report suggested
          maintenance without writing context during testing work.
      - skill_id: ptlam-testing-resolving-environment
        reason: Owns testing environment and toolchain resolution.
        instructions: |-
          Apply ptlam-testing-resolving-environment when the environment or
          toolchain is ambiguous, unverified, incompatible, missing, being
          replaced, or explicitly under review. Pass it the read-only
          testing-context result, then consume its resolved environment, tools,
          constraints, and authority without repeating its selection workflow.
  - id: ptlam-testing-typescript
    description:
      Design, write, update, run, audit, and diagnose tests for framework-free,
      browser-free TypeScript libraries, Node.js code, CLIs, and tooling with
      Vite, Vitest, and Vitest V8 coverage. Use when such a project needs test
      implementation, Vitest configuration, coverage, mocking, Node
      environments, type tests, or stack-specific testing review. Apply
      ptlam-testing first for mode, write authority, testing scope, level,
      behavior, placement, test doubles, TDD, audit, and diagnosis. Do not use
      this specialization for web frameworks, DOM code, or browser-runtime
      testing.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-testing
        reason: Provides the universal testing workflow and mandatory rules.
        instructions: |-
          Read and apply ptlam-testing first.
          Let it own mode, write authority, scope, level, public seam, behavior,
          doubles, TDD, audit, diagnosis, and verification depth.
          Consume the environment and toolchain decision carried by the
          foundation; do not select replacement tools or versions here.
          Use the repository's established test layout when one exists;
          otherwise use this skill's source-adjacent fallback.
          Apply it only to framework-free, browser-free TypeScript, Vite, Vitest,
          and coverage mechanics left open by the foundation.
  - id: ptlam-creating-skill
    description:
      Create, review, or refactor atomic, self-contained agent skills with one
      reusable capability, explicit composition contracts, predictable
      workflows, progressive disclosure, and verifiable acceptance. Use as the
      foundation for skills that specialize skill authoring.
    disable_model_invocation: true
    category_id: engineering
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-grilling
    description:
      Stress-test a plan, decision, or idea through a persistent interview that
      resolves one user-owned decision at a time and records confirmed
      understanding for later continuation.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-creating-atomic-note
    description:
      Create, mature, review, split, or merge durable atomic notes by
      identifying one knowledge building block, preserving useful context, and
      following local vault conventions.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-scrapping-urls
    description:
      Batch-scrape URLs supplied in a prompt or input file into cached local
      Markdown files with configurable output, concurrency, and cache lifetime.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-explaining
    description:
      Explain concepts, mechanisms, and systems through a verified literal model
      and an explanatory device matched to the learner's difficulty.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-explaining-with-analogy
    description:
      Explain an unfamiliar, abstract, or complex concept through one coherent
      real-life analogy, a stable mapping table, a short story, and explicit
      caveats.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-explaining
        reason:
          Provides the learning goal, literal model, and verification the
          analogy is built on.
        instructions: |-
          Read and apply ptlam-explaining first.
          Let it own the learning goal, depth, literal answer, literal model,
          overall composition order, and reconstruction verification. Start the
          analogy workflow from those outputs instead of resolving them again.
          Enter this skill only when the learner explicitly asked for an
          analogy, and apply it only to analogy selection, the mapping gate, the
          story, and the stated limits.
  - id: ptlam-visualization-with-html
    description:
      Create or revise portable, polished, interactive HTML explainers and
      learning artifacts for architecture, workflows, state changes, sequences,
      entity relationships, semantic zoom, and step-by-step behavior using
      native web technologies and Material 3 Expressive.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-explaining-with-analogy
        reason:
          Carries the explanation foundation and owns optional analogy semantics
          before rendering.
        instructions: |-
          Read ptlam-explaining-with-analogy and its required ptlam-explaining
          foundation for every artifact. Apply ptlam-explaining first and let it
          own the learning goal, depth, literal answer, literal model,
          explanatory structure, and reconstruction verification.
          Apply ptlam-explaining-with-analogy only when the user explicitly asks
          to create an analogy and has not already supplied or chosen one.
          Let it own candidates, user choice, stable mapping, story, and
          caveats. Consume those outputs without building a parallel analogy.
          Resume this visualization skill after the choice and let it own only
          the portable HTML rendering and visual interaction.
