# Version of the plugin.yml structure understood by the compiler.
# Change only when the manifest schema becomes incompatible.
schema_version: 2

providers:
  - claude
  - codex
  - copilot
  - gemini
  - kimi

config:
  skill_dependency_depth_limit: 4

name: ptlam-agent-plugin
description:
  A curated collection of portable agent skills for engineering, productivity,
  and utility workflows.

# Plugin version. Build metadata after "+" does not affect SemVer
# precedence.
version: "0.3.0"

author:
  name: Pham Tung Lam
  email: fam.tung.lam@gmail.com
  url: https://github.com/fam-tung-lam
homepage: https://github.com/fam-tung-lam/ptlam-agent-plugin#readme
repository: https://github.com/fam-tung-lam/ptlam-agent-plugin
license: MIT
keywords:
  - agent-skills
  - engineering
  - productivity
  - utilities

# Categories name the layer of work a skill belongs to, so a reader can tell
# deciding from specifying from building at a glance.
categories:
  - id: deciding
    name: Deciding
    description: Turn an open question into a confirmed decision.
  - id: specifying
    name: Specifying
    description: Turn a confirmed decision into a durable document.
  - id: building
    name: Building
    description: Change code and prove the change.
  - id: conventions
    name: Conventions
    description: The shared code standard and its stack specializations.
  - id: communicating
    name: Communicating
    description: Make a concept, a system, or evidence understandable.
  - id: utilities
    name: Utilities
    description: Focused helpers for small, repeatable jobs.
  - id: project-health-connector
    name: Health Connector SDK
    description:
      Project-specific skills for the Health Connector Flutter plugin monorepo.

skills:
  # --- Deciding -------------------------------------------------------------
  - id: ptlam-grilling
    description:
      Stress-test a plan, decision, or idea by asking the user one
      consequential question at a time, saving a resumable session record,
      sharpening contested business terms, and capturing decisions that are
      expensive to reverse. This is the only skill that interviews the user.
    disable_model_invocation: true
    category_id: deciding
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-modeling-domain
        reason:
          Keeps contested business language and context boundaries durable
          while the interview is still resolving them.
        instructions: |-
          Read ptlam-modeling-domain before the interview loop.
          Apply it when a business term is contested, overloaded, or new, or
          when a business context boundary becomes unclear.
          Let it own the glossary, context boundaries, and business process map
          in CONTEXT.md.
          Keep this skill's ownership of the questions, decision map, session
          record, and confirmation loop.
      - skill_id: ptlam-architecturing
        reason:
          Supplies the recommendation, strongest alternative, and main
          trade-off for a decision that fixes a structure expensive to reverse.
        instructions: |-
          Read ptlam-architecturing before the interview loop.
          Apply it when the selected decision fixes a component, runtime, or
          data-store split, a published surface, where the true copy of state
          lives, or a platform commitment.
          Let it own the constraints, frame, options, trade-offs, sizing,
          recommendation, and redesign trigger.
          Keep this skill's ownership of the questions, decision map, session
          record, and confirmation loop.
          Let it write no file; record its judgment in the session record.

  - id: ptlam-architecturing
    description:
      Answer one system-level architecture question with a suitability
      judgment that frames the solution space, positions the options, sizes
      the recommendation for the next order of magnitude, and names its
      trade-offs, assumptions, and redesign trigger. Works for any kind of
      system, from backend and web frontend to mobile, SDK, CLI, data
      pipeline, desktop, embedded, and internal platform. Use when choosing
      component, runtime, data-store, deployment, or integration structure;
      when designing a published surface such as an API, SDK, CLI, schema, or
      file format; when deciding where the true copy of state lives; when a
      platform limit shapes the design; when a debate is stuck on technology
      names; or when judging an existing architecture. Compose it from any
      skill that meets a structure expensive to reverse. Do not use for code
      structure one team changes in one release, business vocabulary, or
      diagnosing one failure.
    category_id: deciding
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-mermaiding
        reason:
          Turns the solution-space frame and the system topology into verified
          visuals that replace the prose describing them.
        instructions: |-
          Read ptlam-mermaiding before drawing the frame or topology visual.
          Let it own the diagram type, Mermaid source, and syntax check.
          Keep this skill's ownership of the dimensions, positions, the meaning
          each mark carries, and the judgment the visual supports.

  - id: ptlam-creating-adr
    description:
      Decide whether one confirmed architecture choice deserves a durable
      architecture decision record, and write the record when it does. Use
      when a confirmed decision splits a component, runtime, or data store,
      publishes a surface such as an API, SDK, CLI, schema, or file format,
      moves where the true copy of state lives, commits to a platform, or
      rejects a plausible alternative for a non-obvious reason. Compose this
      skill from any workflow that needs the record-or-not verdict. Do not use
      for a local implementation choice that is cheap to reverse.
    category_id: deciding
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-explaining
        reason:
          Makes the decision forces and consequences understandable to a future
          reader without changing the accepted choice.
        instructions: |-
          Read and apply ptlam-explaining before drafting a qualifying record.
          Infer the reader's difficulty from the confirmed decision and project
          evidence; do not start an interview.
          Let it own the literal model, explanatory structure, teaching order,
          and reconstruction check.
          Use its explanation package inside the record without changing facts,
          status, schema, destination, or qualification owned by this skill.
          Enter the analogy branch only when the user explicitly asked for one.
      - skill_id: ptlam-mermaiding
        reason:
          Turns material decision forces or architectural effects into verified
          visuals that make the record faster to scan.
        instructions: |-
          Read ptlam-mermaiding before choosing the record's visual form.
          Apply it to material sequences, hierarchies, states, dependencies,
          interactions, or topology; use a table for exact mappings.
          Let it own the visual question, diagram type, Mermaid source, and the
          strongest available syntax and rendering check.
          Keep this skill's ownership of decision facts, qualification,
          document structure, visual placement, and readiness.
          Make each visual replace equivalent prose rather than repeat it.

  - id: ptlam-modeling-domain
    description:
      Model a project's business words, context boundaries, and business
      processes in CONTEXT.md. Use when a business term is contested,
      overloaded, or new, when two contexts use one word differently, or when
      a business process needs a durable map. Compose this skill when an
      interview or an architecture judgment meets a contested business term.
      Do not use for code types, storage schemas, or serialization mechanics.
    category_id: deciding
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-mermaiding
        reason:
          Owns the business process diagram that makes handoffs and decisions
          visible without repeating them in prose.
        instructions: |-
          Read and apply ptlam-mermaiding for every business process map.
          Let it own the visual question, diagram type, notation, Mermaid
          source, and the strongest available syntax and rendering check.
          Keep this skill's ownership of business facts, vocabulary, context
          boundaries, document placement, and glossary checks.
          Make the process diagram replace equivalent prose rather than repeat
          it.

  # --- Specifying -----------------------------------------------------------
  - id: ptlam-creating-prd
    description:
      Create one product requirements document from a confirmed grilling
      record or product brief, for a new product or a large epic. Use when
      product framing, audience, outcomes, scope, non-goals, and success
      measures must become a durable handoff before feature specifications.
      Start a feature inside an existing product at ptlam-creating-spec; skip
      this pipeline for a small fix.
    disable_model_invocation: true
    category_id: specifying
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-explaining
        reason:
          Makes unfamiliar product framing understandable to the document's
          reader without changing confirmed decisions.
        instructions: |-
          Read and apply ptlam-explaining before drafting the document.
          Infer the reader's difficulty from the confirmed source and project
          evidence; do not start another interview.
          Let it own the literal model, explanatory structure, teaching order,
          and reconstruction check.
          Use its explanation package inside the document without changing
          facts, scope, schema, destination, or readiness owned by this skill.
          Enter the analogy branch only when the user explicitly asked for one.
      - skill_id: ptlam-mermaiding
        reason:
          Turns material product relationships into verified visuals that make
          the document faster to scan.
        instructions: |-
          Read ptlam-mermaiding before choosing the document's visual form.
          Apply it to material sequences, hierarchies, states, dependencies, or
          interactions; use a table for exact mappings.
          Let it own the visual question, diagram type, Mermaid source, and the
          strongest available syntax and rendering check.
          Keep this skill's ownership of product facts, document structure,
          visual placement, destination, and readiness.
          Make each visual replace equivalent prose rather than repeat it.

  - id: ptlam-creating-spec
    description:
      Create one buildable feature specification from a confirmed product
      scope item or feature brief inside an existing product. Use when
      behavior, boundaries, failure handling, interfaces, data, rollout
      constraints, and required evidence must be fixed before ticket planning.
      Start a new product or large epic with ptlam-creating-prd; skip this
      pipeline for a small fix.
    disable_model_invocation: true
    category_id: specifying
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-explaining
        reason:
          Makes unfamiliar feature behavior understandable to the document's
          reader without changing confirmed constraints.
        instructions: |-
          Read and apply ptlam-explaining before drafting the specification.
          Infer the reader's difficulty from the confirmed scope and project
          evidence; do not start another interview.
          Let it own the literal model, explanatory structure, teaching order,
          and reconstruction check.
          Use its explanation package inside the specification without changing
          facts, contracts, schema, destination, or readiness owned by this
          skill.
          Enter the analogy branch only when the user explicitly asked for one.
      - skill_id: ptlam-mermaiding
        reason:
          Turns material behavior and system relationships into verified
          visuals that make the specification faster to scan.
        instructions: |-
          Read ptlam-mermaiding before choosing the specification's visual
          form.
          Apply it to material sequences, hierarchies, states, dependencies, or
          interactions; use a table for exact mappings.
          Let it own the visual question, diagram type, Mermaid source, and the
          strongest available syntax and rendering check.
          Keep this skill's ownership of feature facts, document structure,
          visual placement, destination, and readiness.
          Make each visual replace equivalent prose rather than repeat it.
      - skill_id: ptlam-architecturing
        reason:
          Supplies the suitability judgment behind any interface, data,
          compatibility, rollout, or migration structure the specification
          fixes that is expensive to reverse.
        instructions: |-
          Read and apply ptlam-architecturing while modeling the feature
          contract, whenever a contract element fixes a structure expensive to
          reverse and no confirmed judgment or record already covers it;
          otherwise record that source under the architecture constraints.
          Let it own the constraints, frame, options, trade-offs, sizing,
          recommendation, deferred concerns, and redesign trigger.
          Keep this skill's ownership of the feature contract, schema,
          destination, status, and readiness.
          Write the accepted recommendation into the specification as an
          architecture constraint, not as implementation mechanics.

  - id: ptlam-planning-tickets
    description:
      Turn one ready feature specification into an ordered set of vertically
      sliced ticket files with explicit blocking edges. Use after a feature
      specification is ready for implementation planning. A new product or
      large epic starts at ptlam-creating-prd, an existing-product feature
      starts at ptlam-creating-spec, and a small fix skips this pipeline.
    disable_model_invocation: true
    category_id: specifying
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-explaining
        reason:
          Makes unfamiliar ticket intent and dependencies understandable to
          implementers without changing the source specification.
        instructions: |-
          Read and apply ptlam-explaining before drafting the ticket set.
          Infer the implementer's difficulty from the ready specification and
          project evidence; do not start another interview.
          Let it own the literal model, explanatory structure, teaching order,
          and reconstruction check.
          Use its explanation package inside the ticket set without changing
          facts, slices, schema, destination, or readiness owned by this skill.
          Enter the analogy branch only when the user explicitly asked for one.
      - skill_id: ptlam-mermaiding
        reason:
          Makes ticket order and blocking relationships visible as a verified
          dependency map instead of burying them in prose.
        instructions: |-
          Read ptlam-mermaiding before choosing the ticket set's visual form.
          Apply it to the dependency order and any other material
          relationship; use a table for exact mappings.
          Let it own the visual question, diagram type, Mermaid source, and the
          strongest available syntax and rendering check.
          Keep this skill's ownership of ticket facts, vertical slices,
          document structure, visual placement, destination, and readiness.
          Make each visual replace equivalent prose rather than repeat it.

  - id: ptlam-creating-atomic-note
    description:
      Create, mature, review, split, or merge durable atomic notes by finding
      one knowledge building block per note, keeping the context it needs, and
      following the local vault's conventions.
    disable_model_invocation: true
    category_id: specifying
    visibility: public
    status: active
    required_skills: []

  # --- Building -------------------------------------------------------------
  - id: ptlam-implementing
    description:
      Deliver one bounded software change through task-specific worker agents
      in isolated Git worktrees and independent reviewer agents on one
      integration branch. Use when asked to implement from the current prompt
      or confirmed session context. Use when given a specification, ticket
      file, issue, or equivalent task link. Do not use for a read-only
      explanation, plan, diagnosis, or review.
    category_id: building
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-git
        reason:
          Isolates the integration changeset and each worker while protecting
          unrelated work, and disposes of the worktrees afterwards.
        instructions: |-
          Read and apply ptlam-git before creating the integration worktree or
          any worker branch and worktree, and again when disposing of the
          worker worktrees after integration.
          Let it own repository, base, branch, and worktree resolution;
          unrelated-state protection; staging and commit mechanics; worktree
          removal safety; and the final Git check.
          Keep this skill's ownership of the task contract, team sizing, role
          prompts, worker and reviewer coordination, integration, finding
          disposition, repair loop, and readiness.
          Running this skill allows scoped local worktrees, branches, commits,
          and integration. Require explicit permission for a push, pull
          request, issue update, or shared-branch merge, and ask once before
          removing worker worktrees.
      - skill_id: ptlam-code-style
        reason:
          Supplies the language-neutral implementation standard before workers
          author source or tests.
        instructions: |-
          Read and apply ptlam-code-style before authoring source or tests.
          Let it own precedence; complexity; source structure and boundaries;
          naming and readability; data modeling; contracts; failures;
          documentation; logging; evolution; and test behavior, levels,
          placement, and doubles.
          Apply a matching stack or project specialization when one exists.
          Keep this skill's ownership of task capture, team sizing,
          delegation, integration, review coordination, repair, and delivery.
      - skill_id: ptlam-reviewing-code
        reason:
          Supplies the independent review standard and readiness verdict for
          the integrated changeset.
        instructions: |-
          Read and apply ptlam-reviewing-code before dispatching reviewers.
          Let it own the review surface, intent and risk examination, finding
          gate, severity, verification limits, and readiness verdict. Apply a
          matching stack or project review specialization when one exists.
          Keep this skill's ownership of reviewer count, role independence,
          lens assignment, report integration, finding disposition, repair
          delegation, and completion.
          Reviewers stay read-only. Repair workers act only after the main
          agent accepts a finding.
      - skill_id: ptlam-architecturing
        reason:
          Supplies the suitability judgment for a change to a structure
          expensive to reverse that no specification, record, or confirmed
          decision covers.
        instructions: |-
          Read ptlam-architecturing while fixing the task contract.
          Apply it only when the task changes a component, runtime, or
          data-store split, a published surface, where the true copy of state
          lives, or a platform commitment, and no specification, record, or
          confirmed decision covers that change.
          Let it own the constraints, frame, options, trade-offs, sizing,
          recommendation, and open question.
          Keep this skill's ownership of the task contract, the focused
          question to the user, team sizing, delegation, integration, review,
          repair, and delivery.
          Skip it when a source already covers the structure.
      - skill_id: ptlam-diagnosing
        reason:
          Supplies the demonstrated cause before a defect fix is delegated, so
          workers repair a cause instead of a symptom.
        instructions: |-
          Read and apply ptlam-diagnosing while fixing the task contract, but
          only when the task is a defect fix whose cause is not already
          demonstrated by the request, a specification, or the session.
          Let it own the reproduction, evidence labels, failing-boundary model,
          hypothesis ranking, read-only limits, and the cause-or-blocker
          report.
          Put its demonstrated cause, or its evidence blocker, into the task
          contract before sizing the team.
          Keep this skill's ownership of the contract, delegation, integration,
          review, repair, and delivery.
          Skip it for a new capability, a refactor, or an already-diagnosed
          defect.

  - id: ptlam-reviewing-code
    description:
      Review one bounded code changeset and return an evidence-backed,
      prioritized findings report and readiness verdict. Use when reviewing a
      pull request, branch, commit range, or explicit revision comparison. Use
      when reviewing staged, unstaged, or untracked working-tree changes. Use
      when judging an implementation against a task, issue, or specification.
      Compose this skill when a stack or project review needs the general
      review standard.
    category_id: building
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style
        reason:
          Provides the language-neutral conventions a code review judges.
        instructions: |-
          Read and apply ptlam-code-style before judging source or tests.
          Let it own precedence; complexity; source structure and boundaries;
          naming and readability; data modeling; contracts; failures;
          documentation; logging; evolution; and test behavior, levels,
          placement, and doubles.
          Apply a matching stack specialization when one exists.
          Keep this skill's ownership of the review surface, intent, risk
          examination, finding gate, severity, verification limits, and
          readiness verdict.
      - skill_id: ptlam-architecturing
        reason:
          Supplies the judging-suitability standard for a changeset that
          introduces a structure expensive to reverse.
        instructions: |-
          Read ptlam-architecturing while examining the change.
          Apply only its judging-suitability standard, and only when the
          changeset introduces a component, runtime, or data-store split, a
          published surface, state ownership, or a platform commitment.
          Let it own the verdict on that structure and the stale rules of
          thumb to re-check.
          Keep this skill's ownership of the review surface, finding gate,
          severity, and readiness verdict.
          Skip it for a changeset that introduces no such structure.

  - id: ptlam-diagnosing
    description:
      Diagnose one failing software behavior and return a cause whose
      mechanism at the first failing boundary is shown by named observations
      or a deciding check, with every remaining supported alternative ruled
      out, or an exact evidence blocker and one deciding next check. Use when
      software throws, returns the wrong result, hangs, crashes, regresses, or
      behaves differently across environments and the request is for a
      diagnosis. Compose this skill when a stack or project specialization
      adds diagnosis mechanics, or when a fix workflow first needs the cause.
    category_id: building
    visibility: public
    status: active
    required_skills: []

  - id: ptlam-prototyping
    description:
      Build one throwaway prototype to answer one design question. Use when a
      user wants to test a state model, business logic, or data shape through
      a shareable HTML demo, or explore a UI through structurally different
      variants on one route. Works from scratch or beside an existing module
      or page. Do not use for an MVP, production feature, benchmark, or
      durable demo.
    category_id: building
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-git
        reason:
          Isolates tracked prototype changes and preserves an approved
          prototype as evidence without disturbing production work.
        instructions: |-
          Read and apply ptlam-git before a prototype changes a Git repository
          or the user asks to capture it on a branch.
          Let it own repository and worktree resolution, branch mechanics,
          unrelated-state protection, staging, commit construction, and the
          Git check.
          Keep this skill's ownership of the design question, logic-versus-UI
          branch, artifact, handover, answer, and capture intent.
          A prototype request allows local artifact files, not a commit, push,
          issue change, or branch cleanup; require explicit permission for
          those.

  - id: ptlam-git
    description:
      Carry out repository-local Git commit, worktree, and conflict-resolution
      workflows without disturbing unrelated work. Use when creating a commit,
      writing or revising a commit message, creating, using, or removing a
      worktree, deciding whether a repository write belongs in the current
      checkout or a new linked worktree, or resolving an in-progress merge or
      rebase conflict. Compose this skill from any workflow that needs
      isolated branches, worktrees, or commits.
    category_id: building
    visibility: public
    status: active
    required_skills: []

  # --- Conventions ----------------------------------------------------------
  - id: ptlam-code-style
    description:
      Hold source and test code to one language-neutral standard for
      complexity, source structure, boundaries, naming, readability, domain
      modeling, cross-boundary contracts, failure design, documentation,
      logging, evolution, and testing. Use when no stack specialization
      matches the project, and as the foundation every stack specialization
      composes. Use ptlam-modeling-domain instead for business terms and
      context boundaries, and ptlam-architecturing instead for a component,
      runtime, or data-store split, a published surface, state ownership, or a
      platform commitment.
    category_id: conventions
    visibility: public
    status: active
    required_skills: []

  - id: ptlam-code-style-dart
    description:
      Write, review, and fix Dart library and application code against
      conventions for language mechanics, package layout, the analyzer and
      formatter toolchain, dartdoc comments, and package:test tests. Use when
      starting or standardizing a Dart package, changing Dart code or its
      analysis options, reviewing Dart-specific design, or resolving a dart
      analyze, dart format, or dart test failure. Use as the foundation for
      Dart framework and project specializations. Do not use for non-Dart
      code.
    category_id: conventions
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style
        reason:
          Provides the language-neutral conventions and testing doctrine the
          Dart mechanics satisfy.
        instructions: |-
          Read and apply ptlam-code-style first.
          Let it own precedence; complexity; source structure and boundaries;
          naming and readability; data modeling; contracts; failures;
          documentation; logging; the behavior contract; test levels; test
          placement; and test doubles.
          Use this skill only for Dart language, package, and tool mechanics.
          This specialization may be stricter than the foundation, never
          looser.

  - id: ptlam-code-style-kotlin
    description:
      Write, review, and fix Kotlin library and application code against
      conventions for language mechanics, null safety, coroutines, the Gradle,
      ktlint, and detekt toolchain, KDoc comments, and JUnit tests. Use when
      starting or standardizing a Kotlin module, changing Kotlin code or its
      build and lint configuration, reviewing Kotlin-specific design, or
      resolving a ktlint, detekt, or JUnit failure. Use as the foundation for
      Kotlin platform and project specializations. Do not use for Java or
      another JVM language.
    category_id: conventions
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style
        reason:
          Provides the language-neutral conventions and testing doctrine the
          Kotlin mechanics satisfy.
        instructions: |-
          Read and apply ptlam-code-style first.
          Let it own precedence; complexity; source structure and boundaries;
          naming and readability; data modeling; contracts; failures;
          documentation; logging; the behavior contract; test levels; test
          placement; and test doubles.
          Use this skill only for Kotlin language, module, and tool mechanics.
          This specialization may be stricter than the foundation, never
          looser.

  - id: ptlam-code-style-swift
    description:
      Write, review, and fix Swift library and application code against
      conventions for language mechanics, optionals, error handling,
      structured concurrency and actor isolation, the Swift Package Manager,
      SwiftFormat, and SwiftLint toolchain, documentation comments, and tests.
      Use when starting or standardizing a Swift package, changing Swift code
      or its lint and format configuration, reviewing Swift-specific design,
      or resolving a swift build, SwiftLint, or SwiftFormat failure. Use as
      the foundation for Swift platform and project specializations. Do not
      use for Objective-C.
    category_id: conventions
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style
        reason:
          Provides the language-neutral conventions and testing doctrine the
          Swift mechanics satisfy.
        instructions: |-
          Read and apply ptlam-code-style first.
          Let it own precedence; complexity; source structure and boundaries;
          naming and readability; data modeling; contracts; failures;
          documentation; logging; the behavior contract; test levels; test
          placement; and test doubles.
          Use this skill only for Swift language, package, and tool mechanics.
          This specialization may be stricter than the foundation, never
          looser.

  - id: ptlam-code-style-dart-flutter
    description:
      Write, review, and fix Flutter application code against conventions for
      the toolchain, four-layer feature structure, presentation-layer BLoC and
      Cubit state, widgets, routes, models, networking, storage, localization,
      logging, widget documentation, and tests. Use when adding or changing
      Flutter code, choosing between setState, Cubit, and Bloc, placing a new
      file or feature, wiring get_it or go_router, or fixing a flutter analyze
      or build_runner failure. Do not use for Dart outside Flutter or for
      another stack.
    category_id: conventions
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style-dart
        reason:
          Provides the Dart language, package, analyzer, formatter, dartdoc,
          and test mechanics underneath the Flutter boundary.
        instructions: |-
          Read and apply ptlam-code-style-dart first; it loads ptlam-code-style
          as its own foundation.
          Let Dart own the SDK and toolchain, naming, formatting, imports,
          const and final, package layout, dartdoc, and package:test mechanics.
          Use this skill only for Flutter framework, widget, state, routing,
          localization, and Flutter-runner test mechanics.
          This specialization may be stricter than Dart, never looser.

  - id: ptlam-code-style-python
    description:
      Write, review, and fix Python library and application code against
      conventions for language mechanics, project structure, tooling, and
      tests. Use when starting or standardizing a Python project, changing
      Python code or its toolchain, reviewing Python-specific design, or
      resolving code-quality and test failures. Use as the foundation for
      Python framework specializations. Do not use for non-Python code.
    category_id: conventions
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style
        reason:
          Provides the language-neutral conventions and testing doctrine the
          Python mechanics satisfy.
        instructions: |-
          Read and apply ptlam-code-style first.
          Let it own precedence; complexity; source structure and boundaries;
          naming and readability; data modeling; contracts; failures;
