  # --- Communicating --------------------------------------------------------
  - id: ptlam-explaining
    description:
      Explain a concept, mechanism, or system through a verified literal model
      and a teaching device matched to what the learner cannot do. Use when a
      learner needs an unfamiliar, abstract, or complex concept made usable,
      and when a request explicitly asks for a real-life analogy with a stable
      mapping table, a short story, and explicit caveats. Select the analogy
      device only on that explicit ask; a request to explain, define,
      simplify, or break down a concept is not that ask. Compose this skill
      from any workflow whose output a reader must understand.
    category_id: communicating
    visibility: public
    status: active
    required_skills: []

  - id: ptlam-mermaiding
    description:
      Create, revise, or review Mermaid diagrams whose type, structure,
      notation, and layout keep the source relationships and stay readable in
      raw Markdown. Use directly, or from another skill, when the output needs
      a swimlane, flowchart, class, state, ER, sequence, quadrant, mindmap,
      kanban, architecture, or tree-view diagram.
    category_id: communicating
    visibility: public
    status: active
    required_skills: []

  - id: ptlam-visualizing-with-html
    description:
      Create or revise one portable HTML explainer that renders a verified
      explanation as an accessible, optionally interactive page using native
      web technologies and Material 3 Expressive. Use when a learner needs to
      see or operate a system rather than read about it. Compose this skill
      from any workflow that delivers a rendered report or explainer.
    category_id: communicating
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-explaining
        reason:
          Supplies the verified explanation the page renders, including its
          optional analogy branch.
        instructions: |-
          Read and apply ptlam-explaining for every page. Let it own the
          learning goal, depth, literal answer, literal model, explanatory
          structure, and reconstruction check.
          Enter its analogy branch only when the user explicitly asks for an
          analogy or supplies one. Let that branch own the candidates, the
          user's choice, the mapping, the story, and the caveats. Consume those
          outputs without building a second analogy.
          Keep this skill's ownership of the portable HTML rendering and the
          visual interaction.

  - id: ptlam-researching
    description:
      Research one bounded question against high-trust primary sources and
      deliver a traceable portable HTML evidence report. Use when a material
      question needs evidence-led findings, conflict reconciliation, or an
      explicitly inconclusive result.
    category_id: communicating
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-git
        reason:
          Isolates the report inside a repository worktree without disturbing
          unrelated work.
        instructions: |-
          Read and apply ptlam-git when the report's destination is a Git
          repository.
          Let it own repository, base, branch, and worktree resolution;
          unrelated-state protection; and the final Git check.
          Keep this skill's ownership of the question, source standard,
          evidence ledger, findings, confidence, and limits.
          Writing the report file is in scope. Require explicit permission for
          a commit, push, pull request, or publication.
      - skill_id: ptlam-scraping-urls
        reason:
          Supplies accounted local full-text retrieval when the selected
          evidence needs batch scraping or a durable local cache.
        instructions: |-
          Apply ptlam-scraping-urls only when batch or local full-text
          retrieval is needed.
          Let it own URL collection, scraping, cache configuration, bounded
          concurrency and fallback, output files, and result accounting.
          Keep this skill's ownership of source selection, trust
          classification, evidence use, and conclusions.
          Pass the research contract's recency requirement into its cache
          policy.
          Reuse a cached capture only when its original retrieval time and
          source identity satisfy that requirement; otherwise set
          CACHE_TTL_HOURS=0 for that run.
          Keep the original retrieval time as evidence metadata instead of the
          cache-access time.
      - skill_id: ptlam-visualizing-with-html
        reason:
          Turns the verified findings into the portable HTML report and proves
          its accessibility, portability, and rendered quality.
        instructions: |-
          Read and apply ptlam-visualizing-with-html after the findings and
          evidence ledger are verified.
          Pass the question, audience, conclusion status, findings, evidence
          ledger, conflicts, assumptions, gaps, confidence, and scope limits
          forward unchanged.
          Let it and its dependencies own explanatory structure, HTML
          composition, accessibility and design contracts, static validation,
          rendered inspection, and delivery.
          Keep this skill's ownership of source inclusion, claim-to-source
          reconciliation, findings, confidence, limits, and completion.

