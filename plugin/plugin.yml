# Version of the plugin.yml structure understood by the compiler.
# Change only when the manifest schema becomes incompatible.
schema_version: 2

providers:
  - claude
  - codex
  - copilot
  - gemini
  - kimi

name: ptlam-agent-plugin
description:
  A curated collection of portable agent skills for engineering, productivity,
  and utility workflows.

# Plugin version. Build metadata after "+" does not affect SemVer
# precedence.
version: "0.2.0"

author:
  name: Pham Tung Lam
  email: fam.tung.lam@gmail.com
  url: https://github.com/fam-tung-lam
homepage: https://github.com/fam-tung-lam/ptlam-agent-plugin#readme
repository: https://github.com/fam-tung-lam/ptlam-agent-plugin
license: MIT
keywords:
  - agent-skills
  - engineering
  - productivity
  - utilities

categories:
  - id: engineering
    name: Engineering
    description: Skills for reviewing and delivering software changes.
  - id: productivity
    name: Productivity
    description: Skills for planning work and communicating ideas clearly.
  - id: utilities
    name: Utilities
    description: Focused helpers for small, repeatable transformations.
  - id: project-health-connector
    name: Health Connector SDK
    description:
      Project-specific skills for the Health Connector Flutter plugin monorepo.

skills:
  - id: ptlam-setup
    description:
      Install or refresh PTLam's general agent instructions for a project.
    disable_model_invocation: true
    category_id: utilities
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-git
    description:
      Carry out repository-local Git commit, worktree, and conflict-resolution
      workflows without disturbing unrelated work. Use when creating a commit,
      writing or revising a commit message, creating or managing a worktree,
      deciding whether a repository write belongs in the current checkout or a
      new linked worktree, or resolving an in-progress merge or rebase conflict.
    category_id: engineering
    visibility: public
    status: active
    required_skills: []
  - id: ptlam-implementing
    description:
      Deliver one bounded software change through task-specific worker agents
      in isolated Git worktrees and independent reviewer agents on an
      integration branch. Use when asked to implement from the current prompt or
      confirmed session context. Use when given a specification, ticket file,
      issue, or equivalent task link. Do not use for a read-only explanation,
      plan, diagnosis, or review.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-git
        reason:
          Isolates the integration changeset and each editing worker while
          protecting unrelated work across concurrent worktrees.
        instructions: |-
          Read and apply ptlam-git before the main agent creates the integration
          worktree or any worker branch and worktree.
          Let it own repository, base, branch, and worktree resolution;
          unrelated-state protection; staging and commit mechanics; and final
          Git verification.
          Keep this skill's ownership of the task contract, team sizing, role
          prompts, worker and reviewer coordination, integration, finding
          disposition, repair loop, and readiness decision.
          Invoking this skill authorizes scoped local worktrees, branches,
          commits, and integration operations. Require explicit authority for a
          push, pull request, issue update, shared-branch merge, or cleanup.
      - skill_id: ptlam-reviewing-code
        reason:
          Supplies the independent review standard and readiness verdict for the
          integrated implementation changeset.
        instructions: |-
          Read and apply ptlam-reviewing-code before dispatching reviewer
          agents.
          Let it own the review surface, intent and risk examination, finding
          gate, severity, verification limits, and readiness verdict. Apply a
          matching stack or project review specialization when one is
          available.
          Keep this skill's ownership of reviewer count, role independence,
          lens assignment, report integration, finding disposition, repair
          delegation, and final completion.
          Reviewer agents stay read-only. Repair agents act only after the main
          agent accepts a finding.
  - id: ptlam-researching
    description:
      Research one bounded question against high-trust primary sources and
      deliver a traceable portable HTML evidence report inside an existing Git
      repository. Use when a material question needs evidence-led findings,
      conflict reconciliation, or an explicitly inconclusive result.
    category_id: productivity
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-implementing
        reason:
          Processes the research run as one isolated, independently reviewed
          report implementation.
        instructions: |-
          Read and apply ptlam-implementing before research begins.
          Treat the bounded question and portable HTML report as its task
          contract and changeset.
          Let it own task-contract capture; repository, branch, and worktree
          isolation; team sizing; worker and reviewer coordination;
          integration; finding disposition; repair; and readiness.
          Keep this skill's ownership of the research question, source
          inclusion standard, evidence ledger, claim reconciliation, findings,
          confidence, limits, and research completion.
          Treat supplied, discovered, fetched, and scraped research sources as
          evidence inputs owned by this skill, not as ptlam-implementing
          task-authority sources.
          Apply this skill's conflict, gap, and inconclusive rules when research
          evidence is inaccessible or contradictory.
          Treat the direct request, confirmed current-session decisions,
          governing specifications, tickets, or issues, and repository
          instructions as task-authority sources when they define task intent or
          authority.
          Apply ptlam-implementing's stop gate only when a required
          task-authority source remains inaccessible or those sources contradict
          each other.
          Preserve ptlam-implementing's authority limits for pushes, pull
          requests, issue updates, shared-branch merges, and cleanup.
          Keep retrieval configuration, caches, and scraped files outside the
          report changeset unless the task contract explicitly requests their
          archival.
      - skill_id: ptlam-scraping-urls
        reason:
          Supplies accounted local full-text retrieval when the selected
          evidence requires batch scraping or a durable local cache.
        instructions: |-
          Apply ptlam-scraping-urls only when batch or local full-text retrieval
          is needed.
          Let it own URL collection, scraping, cache configuration, bounded
          concurrency and fallback, output files, and result accounting.
          Keep this skill's ownership of source selection, trust
          classification, evidence use, and research conclusions.
          Pass the research contract's recency or as-of requirement into its
          effective cache policy.
          Reuse a cached capture only when its original retrieval time and source
          identity satisfy that requirement; otherwise set CACHE_TTL_HOURS=0 for
          that run.
          Preserve the original retrieval time as evidence metadata instead of
          substituting the current cache-access time.
      - skill_id: ptlam-visualization-with-html
        reason:
          Turns the verified findings into the portable HTML evidence report and
          proves its accessibility, portability, and rendered quality.
        instructions: |-
          Read and apply ptlam-visualization-with-html after the research
          findings and evidence ledger are verified.
          Pass the research question, audience, conclusion status, findings,
          evidence ledger including source-admission evidence, conflicts,
          assumptions, gaps, confidence, and scope limits forward unchanged.
          Let that skill and its dependencies own explanatory structure, HTML
          composition, native artifact implementation, accessibility and design
          contracts, static validation, rendered inspection, and delivery.
          Keep this skill's ownership of source inclusion, claim-to-source
          reconciliation, findings, confidence, limits, and research
          completion.
  - id: ptlam-prototyping
    description:
      Build one throwaway prototype to answer a design question. Use when a user
      wants to test a state model, business logic, or data shape through a
      shareable HTML demo, or explore a UI through structurally different
      variants on one route. Works from scratch or beside an existing module or
      page. Do not use for an MVP, production feature, technical benchmark, or
      durable demo.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-git
        reason:
          Isolates tracked prototype changes and preserves an authorized
          prototype primary source without disturbing production work.
        instructions: |-
          Read and apply ptlam-git before a prototype changes a Git repository
          or the user requests branch capture.
          Let it own repository and worktree resolution, branch mechanics,
          unrelated-state protection, staging, commit construction, and Git
          verification.
          Keep this skill's ownership of the design question, logic-versus-UI
          branch, prototype artifact, evaluator handoff, answer, and capture
          intent.
          A prototype request authorizes local artifact files, not a commit,
          push, issue change, or branch cleanup; require explicit authority for
          those effects.
  - id: ptlam-code-style
    description:
      Hold source and test code to one language-neutral set of conventions for
      source-tree structure, module boundaries, naming, function readability,
      domain modeling, cross-boundary contracts, failure design, documentation,
      logging, and testing. Use when placing or naming a file, setting a public
      or internal boundary, shaping a domain type or its states, promising an
      interface across a process or release boundary, designing a failure or a
      retry, writing a doc comment, emitting a log record, deciding what a test
      must prove, choosing a test level, placing a test or a test double, or
      planning how a change migrates. Use ptlam-modeling-domain instead for
      business terminology, context boundaries, and business process maps. Use
      as the foundation for a stack specialization that adds the mechanics.
    category_id: engineering
    visibility: internal
    status: active
    required_skills: []
  - id: ptlam-code-style-dart
    description:
      Write, review, and fix Dart library and application code against
      conventions for language mechanics, package layout, the analyzer and
      formatter toolchain, dartdoc comments, and package:test tests. Use when
      starting or standardizing a Dart package, changing Dart code or its
      analysis options, reviewing Dart-specific design, or resolving a dart
      analyze, dart format, or dart test failure. Apply ptlam-code-style first
      for the standard these mechanics satisfy. Use as the foundation for Dart
      framework and project specializations. Do not use for non-Dart code.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style
        reason:
          Provides the language-neutral conventions and testing doctrine the
          Dart mechanics satisfy.
        instructions: |-
          Read and apply ptlam-code-style first.
          Let it own precedence; the structure, boundary, naming, readability,
          data-modeling, contract, failure, documentation, and logging
          standards; the universal behavior contract; test levels; test
          placement; and test doubles.
          Use this skill only for Dart language, package, and tool mechanics
          that satisfy those standards.
          This specialization may be stricter than the foundation, never looser.
  - id: ptlam-code-style-kotlin
    description:
      Write, review, and fix Kotlin library and application code against
      conventions for language mechanics, null safety, coroutines, the Gradle,
      ktlint, and detekt toolchain, KDoc comments, and JUnit tests. Use when
      starting or standardizing a Kotlin module, changing Kotlin code or its
      build and lint configuration, reviewing Kotlin-specific design, or
      resolving a ktlint, detekt, or JUnit failure. Apply ptlam-code-style first
      for the standard these mechanics satisfy. Use as the foundation for Kotlin
      platform and project specializations. Do not use for Java or for another
      JVM language.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style
        reason:
          Provides the language-neutral conventions and testing doctrine the
          Kotlin mechanics satisfy.
        instructions: |-
          Read and apply ptlam-code-style first.
          Let it own precedence; the structure, boundary, naming, readability,
          data-modeling, contract, failure, documentation, and logging
          standards; the universal behavior contract; test levels; test
          placement; and test doubles.
          Use this skill only for Kotlin language, module, and tool mechanics
          that satisfy those standards.
          This specialization may be stricter than the foundation, never looser.
  - id: ptlam-code-style-swift
    description:
      Write, review, and fix Swift library and application code against
      conventions for language mechanics, optionals, error handling, structured
      concurrency and actor isolation, the Swift Package Manager, SwiftFormat,
      and SwiftLint toolchain, documentation comments, and tests. Use when
      starting or standardizing a Swift package, changing Swift code or its
      lint and format configuration, reviewing Swift-specific design, or
      resolving a swift build, SwiftLint, or SwiftFormat failure. Apply
      ptlam-code-style first for the standard these mechanics satisfy. Use as
      the foundation for Swift platform and project specializations. Do not use
      for Objective-C.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style
        reason:
          Provides the language-neutral conventions and testing doctrine the
          Swift mechanics satisfy.
        instructions: |-
          Read and apply ptlam-code-style first.
          Let it own precedence; the structure, boundary, naming, readability,
          data-modeling, contract, failure, documentation, and logging
          standards; the universal behavior contract; test levels; test
          placement; and test doubles.
          Use this skill only for Swift language, package, and tool mechanics
          that satisfy those standards.
          This specialization may be stricter than the foundation, never looser.
  - id: ptlam-code-style-flutter
    description:
      Write, review, and fix Flutter application code against conventions for
      the toolchain, layer boundaries, source tree, widgets, models, networking,
      storage, localization, logging, widget documentation, and tests. Use when
      adding or changing Flutter code, choosing between setState, Cubit, and
      Bloc, placing a new file or feature, wiring get_it or go_router, or fixing
      a flutter analyze or build_runner failure. Apply ptlam-code-style-dart
      first for the Dart language, package, and tooling mechanics. Do not use
      this specialization for Dart outside Flutter or for another stack.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style-dart
        reason:
          Provides the Dart language, package, analyzer, formatter, dartdoc, and
          test mechanics underneath the Flutter framework boundary.
        instructions: |-
          Read and apply ptlam-code-style-dart first; it loads ptlam-code-style
          as its own foundation.
          Let Dart own the SDK and toolchain, naming, formatting, imports,
          const and final, package layout, dartdoc, and package:test mechanics.
          Use this skill only for Flutter framework, widget, state, routing,
          localization, and Flutter-runner test mechanics.
          This specialization may be stricter than Dart, never looser.
  - id: ptlam-code-style-python
    description:
      Write, review, and fix Python library and application code against
      conventions for language mechanics, project structure, tooling, and
      tests. Use when starting or standardizing a Python project, changing
      Python code or its toolchain, reviewing Python-specific design, or
      resolving code-quality and test failures. Apply ptlam-code-style first for
      the standard these mechanics satisfy. Use as the foundation for Python
      framework specializations. Do not use for non-Python code.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style
        reason:
          Provides the language-neutral conventions and testing doctrine the
          Python mechanics satisfy.
        instructions: |-
          Read and apply ptlam-code-style first.
          Let it own precedence; the structure, boundary, naming, readability,
          data-modeling, contract, failure, documentation, and logging
          standards; the universal behavior contract; test levels; test
          placement; and test doubles.
          Use this skill only for Python language, library, and tool mechanics
          that satisfy those standards.
          This specialization may be stricter than the foundation, never looser.
  - id: ptlam-code-style-python-fastapi
    description:
      Write, review, and fix FastAPI application code against conventions for
      service and feature-package structure, application lifespan, routes,
      request and response contracts, dependency injection, use cases, feature
      boundaries, model registration, concurrency, errors, observability, and
      API tests. Use when starting or reorganizing a FastAPI service or feature,
      adding or changing endpoints, use cases, dependencies, exception
      handlers, middleware, schemas, SQLAlchemy registration, background
      handoffs, or tests, or fixing OpenAPI and runtime failures. Apply
      ptlam-code-style-python first for the Python mechanics. Do not use for
      Python services that do not use FastAPI.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style-python
        reason:
          Provides the Python language, data-model, concurrency, exception, and
          pytest mechanics underneath the FastAPI boundary.
        instructions: |-
          Read and apply ptlam-code-style-python first; it loads
          ptlam-code-style as its own foundation.
          Let Python own the interpreter and toolchain, modules, imports,
          typing, general async work, Pydantic, exception mechanics, docstrings,
          logging, and pytest.
          Use this skill only for FastAPI application, HTTP, dependency,
          lifecycle, and ASGI test mechanics.
          This specialization may be stricter than Python, never looser.
  - id: ptlam-code-style-typescript
    description:
      Write, review, and fix TypeScript library and application code against
      conventions for language mechanics, module boundaries, tooling, and tests.
      Use when starting or standardizing a TypeScript project, changing
      TypeScript code or its toolchain, reviewing TypeScript-specific design, or
      resolving type-check, lint, or Vitest failures. Apply ptlam-code-style
      first for the standard these mechanics satisfy. Use as the foundation for
      TypeScript framework specializations. Do not use for non-TypeScript code.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style
        reason:
          Provides the language-neutral conventions and testing doctrine the
          TypeScript mechanics satisfy.
        instructions: |-
          Read and apply ptlam-code-style first.
          Let it own precedence; the structure, boundary, naming, readability,
          data-modeling, contract, failure, documentation, and logging
          standards; the universal behavior contract; test levels; test
          placement; and test doubles.
          Use this skill only for TypeScript language, package, and tool
          mechanics that satisfy those standards.
          This specialization may be stricter than the foundation, never looser.
  - id: ptlam-code-style-typescript-nestjs
    description:
      Write, review, and fix NestJS TypeScript backend code against conventions
      for feature-first structure, use cases, integrations, modules, dependency
      injection, application lifecycle, entry points, persistence handoffs,
      observability, health, and Nest testing. Use when starting or reorganizing
      a NestJS backend or feature, changing use cases, controllers, providers,
      processors, schedules, commands, global enhancers, DTO pipes, adapters,
      transports, transactions, shutdown, or tests, or resolving Nest module and
      runtime failures. Apply ptlam-code-style-typescript first for TypeScript
      mechanics. Do not use for TypeScript applications that do not use NestJS.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style-typescript
        reason:
          Provides the TypeScript language, package, runtime-validation, async,
          error, logging, and Vitest mechanics underneath the NestJS boundary.
        instructions: |-
          Read and apply ptlam-code-style-typescript first; it loads
          ptlam-code-style as its own foundation.
          Let TypeScript own Node and package tooling, modules and imports,
          typing, validator choice, general async and resource lifetime, error
          and logging mechanics, documentation, and Vitest.
          Use this skill only for NestJS feature structure, use-case assembly,
          module, injection, application, lifecycle, execution-pipeline, adapter,
          transport, worker, persistence-handoff, health, and Nest testing
          mechanics.
          For external input, the TypeScript validator choice wins; this skill
          owns only its Nest pipe and DTO or contract-metadata integration.
          This specialization may be stricter than TypeScript, never looser.
  - id: ptlam-creating-skill
    description:
      Create, review, or refactor one agent skill so that a human maintainer can
      read it once and change it later. Use when turning a workflow or reference
      set into a new skill, revising an existing SKILL.md, splitting a skill
      that grew too broad, or auditing a package without editing it. Use as the
      foundation for skills that specialize skill authoring.
    disable_model_invocation: true
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-mermaiding
        reason:
          Owns every Mermaid diagram a skill package carries, from type
          selection to syntax verification.
        instructions: |-
          Read ptlam-mermaiding before judging an existing diagram or deciding
          whether a new diagram is warranted.
          Apply its authoring workflow only when the selected form is a diagram.
          Let it own the visual question, diagram type, notation, layout, and
          syntax verification for that diagram.
          Keep this skill's ownership of what the package says, which form
          carries each point, and which file holds it.
  - id: ptlam-reviewing-code
    description:
      Review one bounded code changeset and return an evidence-backed,
      prioritized findings report and readiness verdict. Use when reviewing a
      pull request, branch, commit range, or explicit revision comparison. Use
      when reviewing staged, unstaged, or untracked working-tree changes. Use
      when judging an implementation against a task, issue, or specification.
      Compose this skill when a stack or project review needs the general review
      standard.
    category_id: engineering
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-code-style
        reason:
          Provides the language-neutral source, boundary, failure,
          documentation, logging, and testing conventions a code review judges.
        instructions: |-
          Read and apply ptlam-code-style before judging source or tests.
          Let it own precedence; source structure and boundaries; naming and
          readability; data modeling; contracts; failures; documentation;
          logging; evolution; test behavior, levels, placement, and doubles.
          Apply a matching stack specialization when one is available.
          Let this skill own the review surface, intent, risk examination,
          finding gate, severity, verification limits, and readiness verdict.
  - id: ptlam-grilling
    description:
      Stress-test a plan, decision, or idea through a persistent interview that
      resolves one user-owned decision at a time, records confirmed
      understanding for later continuation, sharpens contested business terms,
      and captures decisions that are expensive to reverse.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-modeling-domain
        reason:
          Keeps contested business language and context boundaries durable while
          the interview is still resolving them.
        instructions: |-
          Read ptlam-modeling-domain before the interview loop.
          Apply it when a business term is contested, overloaded, or newly
          coined, or when a business context boundary becomes unclear.
          Let it own the glossary, context boundaries, and business process map
          in CONTEXT.md.
          Keep this skill's ownership of the questions, decision map, session
          record, and confirmation loop.
      - skill_id: ptlam-creating-adr
        reason:
          Preserves consequential architectural decisions when the interview
          makes them concrete enough to evaluate and record.
        instructions: |-
          Read ptlam-creating-adr before the interview loop.
          Apply its qualification gate when a decision becomes expensive to
          reverse, constrains future architecture, or carries material rejected
          alternatives.
          Let it own the ADR qualification verdict, destination, shape, and
          verification.
          Keep this skill's ownership of the questions, decision map, session
          record, and confirmation loop.
  - id: ptlam-creating-prd
    description:
      Create one product requirements document from a confirmed grilling record
      or durable product brief for a new product or large epic. Use when product
      framing, audience, outcomes, scope, non-goals, and success measures must
      become a durable handoff before feature specifications. Start an
      existing-product feature at ptlam-creating-spec; skip this pipeline for a
      small fix.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-explaining
        reason:
          Makes unfamiliar product framing reconstructable for the document's
          reader without changing confirmed product decisions.
        instructions: |-
          Read and apply ptlam-explaining before drafting the PRD.
          Infer the reader's likely difficulty from the confirmed source and
          project evidence; do not start another interview.
          Let it own the literal model, explanatory structure, teaching order,
          and reconstruction check for unfamiliar or complex content.
          Use its explanation package inside the PRD without changing facts,
          scope, schema, destination, or readiness owned by this skill.
          Enter the analogy branch only when the user explicitly requested it.
      - skill_id: ptlam-mermaiding
        reason:
          Turns material product relationships into verified visuals that make
          the PRD faster to scan and understand.
        instructions: |-
          Read ptlam-mermaiding before choosing the PRD's visual form.
          Apply it to material sequences, hierarchies, states, dependencies,
          interactions, or other relationships; use a table for exact mappings
          or comparisons.
          Let it own the visual question, diagram type, Mermaid source, and the
          strongest available syntax and rendering verification.
          Keep this skill's ownership of product facts, document structure,
          visual placement, destination, and readiness.
          Make each visual replace equivalent prose rather than repeat it.
  - id: ptlam-creating-spec
    description:
      Create one buildable feature specification from a confirmed PRD scope item
      or a feature brief inside an existing product. Use when behavior,
      boundaries, failure handling, interfaces, data, rollout constraints, and
      required evidence must be fixed before ticket planning. Start a new
      product or large epic with ptlam-creating-prd; skip this pipeline for a
      small fix.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-explaining
        reason:
          Makes unfamiliar feature behavior reconstructable for the document's
          reader without changing confirmed product or technical constraints.
        instructions: |-
          Read and apply ptlam-explaining before drafting the feature spec.
          Infer the reader's likely difficulty from the confirmed scope and
          project evidence; do not start another interview.
          Let it own the literal model, explanatory structure, teaching order,
          and reconstruction check for unfamiliar or complex content.
          Use its explanation package inside the spec without changing facts,
          contracts, schema, destination, or readiness owned by this skill.
          Enter the analogy branch only when the user explicitly requested it.
      - skill_id: ptlam-mermaiding
        reason:
          Turns material behavior and system relationships into verified visuals
          that make the specification faster to scan and understand.
        instructions: |-
          Read ptlam-mermaiding before choosing the spec's visual form.
          Apply it to material sequences, hierarchies, states, dependencies,
          interactions, or other relationships; use a table for exact mappings
          or comparisons.
          Let it own the visual question, diagram type, Mermaid source, and the
          strongest available syntax and rendering verification.
          Keep this skill's ownership of feature facts, document structure,
          visual placement, destination, and readiness.
          Make each visual replace equivalent prose rather than repeat it.
  - id: ptlam-planning-tickets
    description:
      Turn one ready feature specification into an ordered set of vertically
      sliced ticket files with explicit blocking edges. Use after a feature spec
      is ready for implementation planning. A new product or large epic starts
      at ptlam-creating-prd, an existing-product feature starts at
      ptlam-creating-spec, and a small fix skips this pipeline.
    disable_model_invocation: true
    category_id: productivity
    visibility: public
    status: active
    required_skills:
      - skill_id: ptlam-explaining
        reason:
          Makes unfamiliar ticket intent and dependencies reconstructable for
          implementers without changing the source specification.
        instructions: |-
          Read and apply ptlam-explaining before drafting the ticket set.
          Infer the implementer's likely difficulty from the ready spec and
          project evidence; do not start another interview.
          Let it own the literal model, explanatory structure, teaching order,
          and reconstruction check for unfamiliar or complex content.
          Use its explanation package inside the ticket set without changing
          facts, slices, schema, destination, or readiness owned by this skill.
          Enter the analogy branch only when the user explicitly requested it.
      - skill_id: ptlam-mermaiding
        reason:
          Makes ticket order and blocking relationships visible as a verified
          dependency map rather than burying them in prose.
        instructions: |-
          Read ptlam-mermaiding before choosing the ticket set's visual form.
          Apply it to the dependency order and any other material relationship;
          use a table for exact mappings or comparisons.
          Let it own the visual question, diagram type, Mermaid source, and the
